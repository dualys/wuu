[package]
name = "wuu"
version = "0.1.1"
edition = "2024"
description = "Ui library for dualys"
repository = "https://github.com/dualys/wuu"
license = "AGPL-3.0-or-later"

[dependencies]
spin = { version = "0.12.3", default-features = false, features = [
    "mutex",
    "spin_mutex",
] }
os-terminal = { version = "0.7.4", default-features = false, features = [
    "bitmap",
] }
noun = "0.1.0"
