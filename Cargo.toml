[package]
name = "wuu"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "Allocation-free terminal UI helpers for no_std operating systems and VCS tools"
repository = "https://github.com/dualys/wuu"
license = "AGPL-3.0-or-later"
keywords = ["no-std", "terminal", "vcs", "operating-system", "tui"]
categories = ["no-std", "command-line-utilities", "development-tools"]

[features]
default = []
linux-keyboard = ["dep:crossterm"]

[dependencies]
crossterm = { version = "0.28", optional = true }
spin = { version = "0.12.3", default-features = false, features = [
    "mutex",
    "spin_mutex",
] }
os-terminal = { version = "0.7.4", default-features = false, features = [
    "bitmap",
] }
noun = "0.1.0"
unicode-width = { version = "0.2.2", default-features = false }

[[example]]
name = "prompts"
required-features = ["linux-keyboard"]
